name: hweek
description: An app showcasing the Holy Week events and ceremonies in Piano di
  Sorrento and nearby.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_osm_plugin: ^1.3.6
  google_fonts: ^6.2.1
  http: ^1.3.0
  intl: ^0.19.0
  meta: ^1.16.0

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
